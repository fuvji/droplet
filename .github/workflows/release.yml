name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned GNU-hosted Rust toolchain
        shell: pwsh
        run: |
          # The GNU host ships the self-contained Windows import libraries.
          # Installing a GNU target under the MSVC host leaves -luser32 and
          # friends unresolved on a clean runner.
          rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal --component rustfmt
          rustup default 1.99.1-x86_64-pc-windows-gnu
          rustup override set 1.99.1-x86_64-pc-windows-gnu
          rustc --version --verbose
          cargo --version

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Test the GNU release target
        run: cargo test --release --locked --target x86_64-pc-windows-gnu

      - name: Build the release artifact
        shell: pwsh
        run: .\tools\build-release.ps1

      - name: Stage and verify the source-built artifact
        shell: pwsh
        run: |
          $expected = "7ab6aed9862148dce35872fed3dbe029082cb6dd2ac1ca79f4170ee7511d3ded"
          $artifact = "target\x86_64-pc-windows-gnu\release\droplet.exe"
          $actual = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Source-built exe does not match the checked-in release hash: $actual != $expected"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath $artifact "dist/droplet.exe"
          "Droplet $env:GITHUB_REF_NAME - SHA-256`n`n$actual  droplet.exe" |
            Set-Content "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/droplet.exe
            dist/SHA256SUMS.txt

      - name: Stage attestation bundle
        shell: pwsh
        run: Copy-Item -LiteralPath "${{ steps.attest.outputs.bundle-path }}" "dist/droplet.intoto.jsonl"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "releases/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path $notes)) { $notes = "CHANGELOG.md" }
          gh release create $env:GITHUB_REF_NAME `
            "dist/droplet.exe" `
            "dist/SHA256SUMS.txt" `
            "dist/droplet.intoto.jsonl" `
            --title "Droplet $env:GITHUB_REF_NAME" `
            --notes-file $notes
