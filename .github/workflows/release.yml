name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Test
        run: cargo test --release --target x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Stage portable exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/droplet.exe" "dist/droplet.exe"
          $hash = (Get-FileHash "dist/droplet.exe" -Algorithm SHA256).Hash.ToLower()
          "Droplet $env:GITHUB_REF_NAME - SHA-256`n`n$hash  droplet.exe" |
            Set-Content "dist/SHA256SUMS.txt" -Encoding ascii
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "releases/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path $notes)) { $notes = "CHANGELOG.md" }
          gh release create $env:GITHUB_REF_NAME `
            "dist/droplet.exe" `
            "dist/SHA256SUMS.txt" `
            --title "Droplet $env:GITHUB_REF_NAME" `
            --notes-file $notes
