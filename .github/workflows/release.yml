name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Test
        run: cargo test --release --target x86_64-pc-windows-msvc
      - name: Stage verified exe
        shell: pwsh
        run: |
          $expected = "288b1019d61e46805fff31737ab926c52bc20541a53ef05841c8b356a27f5873"
          $artifact = "site/public/downloads/droplet.exe"
          $actual = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Published exe hash does not match the release notes." }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $artifact "dist/droplet.exe"
          "Droplet $env:GITHUB_REF_NAME - SHA-256`n`n$actual  droplet.exe" |
            Set-Content "dist/SHA256SUMS.txt" -Encoding ascii
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "releases/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path $notes)) { $notes = "CHANGELOG.md" }
          gh release create $env:GITHUB_REF_NAME `
            "dist/droplet.exe" `
            "dist/SHA256SUMS.txt" `
            --title "Droplet $env:GITHUB_REF_NAME" `
            --notes-file $notes
