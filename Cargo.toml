[package]
name = "droplet"
version = "2.10.5"
edition = "2021"
description = "Droplet - local Minecraft keyboard and mouse macro suite"
license = "LicenseRef-Proprietary"

[[bin]]
name = "droplet"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
overflow-checks = false
